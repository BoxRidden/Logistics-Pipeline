# version: '3.8'

x-airflow-common:
  &airflow-common
  # image: ${AIRFLOW_IMAGE_NAME:-apache/airflow:2.7.3}
  build: .
  environment:
    &airflow-common-env
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres-airflow/airflow
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: 'true'
    AIRFLOW__CORE__LOAD_EXAMPLES: 'false'
    AIRFLOW__WEBSERVER__SECRET_KEY: 'a_very_secure_random_string_12345'
    
    # 1. Install additional Python packages for Airflow and dbt
    _PIP_ADDITIONAL_REQUIREMENTS: "pandas google-cloud-bigquery google-cloud-storage google-auth db-dtypes pyspark==3.5.1 dbt-bigquery"
    # 2. Passed API Keys from your local .env into the Airflow containers
    TOMORROWIO_API_KEY: ${TOMORROWIO_API_KEY}
    OPENWEATHER_API_KEY: ${OPENWEATHER_API_KEY}
    
    # 3. Passed GCP Project Settings & Service Account Auth
    GCS_BRONZE_BUCKET: ${GCS_BRONZE_BUCKET}
    GCP_SA_KEYFILE: /opt/airflow/config/gcp-key.json
    GOOGLE_APPLICATION_CREDENTIALS: /opt/airflow/config/gcp-key.json

  volumes:
    - ./dags:/opt/airflow/dags
    - ./logs:/opt/airflow/logs
    - ./plugins:/opt/airflow/plugins
    - ./dbt:/opt/airflow/dbt
    - ./config:/opt/airflow/config
  depends_on:
    postgres-airflow:
      condition: service_healthy

services:
  # 1. Airflow Metadata Database
  postgres-airflow:
    image: postgres:13
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "airflow"]
      interval: 10s
      retries: 5
    restart: always

  # 2. Source Database (Logistics CDC Simulation)
  postgres-source:
    image: postgres:13
    environment:
      POSTGRES_USER: ${SOURCE_DB_USER:-logistics_admin}
      POSTGRES_PASSWORD: ${SOURCE_DB_PASSWORD:-supersecret}
      POSTGRES_DB: ${SOURCE_DB_NAME:-logistics_db}
    ports:
      - "5433:5432"
    volumes:
      - ./data-init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "logistics_admin"]
      interval: 10s
      retries: 5
    restart: always

  # 3. Airflow Web UI
  airflow-webserver:
    <<: *airflow-common
    command: webserver
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/health"]
      interval: 30s
      retries: 5
    restart: always

  # 4. Airflow Scheduler (Handles Data-Aware Datasets)
  airflow-scheduler:
    <<: *airflow-common
    command: scheduler 
    restart: always

  # 5. Airflow Triggerer (Required for modern Airflow sensors/datasets)
  airflow-triggerer:
    <<: *airflow-common
    command: triggerer
    restart: always

  # 6. Airflow Initialization 
  airflow-init:
    <<: *airflow-common
    command: version
    environment:
      <<: *airflow-common-env
      _AIRFLOW_DB_UPGRADE: 'true'
      _AIRFLOW_WWW_USER_CREATE: 'true'
      _AIRFLOW_WWW_USER_USERNAME: ${_AIRFLOW_WWW_USER_USERNAME:-airflow}
      _AIRFLOW_WWW_USER_PASSWORD: ${_AIRFLOW_WWW_USER_PASSWORD:-airflow}

  # 7. Kafka & Zookeeper for CDC Simulation
  zookeeper:
    image: confluentinc/cp-zookeeper:7.4.0
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"
    restart: always

  kafka:
    image: confluentinc/cp-kafka:7.4.0
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    restart: always
  
  #8. MLFlow
  mlflow:
    image: ghcr.io/mlflow/mlflow:v2.12.1
    container_name: logisticspipeline-mlflow
    ports:
      - "5001:5000"
    command: >
      mlflow server 
      --host 0.0.0.0 
      --serve-artifacts

